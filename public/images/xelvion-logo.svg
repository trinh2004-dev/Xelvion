<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <!-- Wing 1 (Indigo to Purple to Cyan) -->
    <linearGradient id="logoWing1" x1="12" y1="12" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wing 2 (Cyan to Blue to Indigo) -->
    <linearGradient id="logoWing2" x1="60" y1="12" x2="12" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Ambient glow in center -->
    <radialGradient id="logoGlow" cx="36" cy="36" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient for "X" in wordmark -->
    <linearGradient id="xGrad" x1="88" y1="20" x2="114" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="88" y1="56" x2="260" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="logoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LOGO MARK CONTAINER (72x72 box, centered at 36) -->
  <g transform="translate(6, 6)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0B0F19" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
    
    <!-- Glow -->
    <circle cx="30" cy="30" r="18" fill="url(#logoGlow)"/>

    <!-- Intersecting Futuristic X -->
    <g filter="url(#logoBloom)">
      <!-- Left-to-Right diagonal Ribbon -->
      <path d="M14 13 C14 12 16 11 18 12 L26 19 L34 26 L46 38 C48 40 47 43 44 44 L38 46 C36 46.5 34 45.5 32 43.5 L24 35.5 L16 27.5 L13 20 C12 17 13 14 14 13 Z" 
            fill="url(#logoWing1)"/>

      <!-- Right-to-Left diagonal Ribbon -->
      <path d="M46 13 C47 14 48 17 47 20 L44 27.5 L36 35.5 L28 43.5 C26 45.5 24 46.5 22 46 L16 44 C13 43 12 40 14 38 L26 26 L34 19 L42 12 C44 11 46 12 46 13 Z" 
            fill="url(#logoWing2)"/>

      <!-- Center Nexus Diamond -->
      <polygon points="30,24 24,30 30,36 36,30" fill="#FFFFFF"/>
      <polygon points="30,26 26,30 30,34 34,30" fill="#06B6D4"/>
    </g>
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(80, 0)">
    <!-- "XELVION" title -->
    <text x="0" y="41" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#FFFFFF">
      <tspan fill="url(#xGrad)">X</tspan>ELVION
    </text>

    <!-- Subtitle: "ENGINEERING & AI" -->
    <text x="2" y="58" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="2.8" 
          fill="url(#subGrad)">
      ENGINEERING &amp; AI LABS
    </text>
  </g>
</svg>
