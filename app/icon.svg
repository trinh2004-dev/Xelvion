<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Wing 1 (Indigo to Purple) -->
    <linearGradient id="wing1Grad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wing 2 (Cyan to Blue) -->
    <linearGradient id="wing2Grad" x1="100" y1="20" x2="20" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="coreGlow" cx="60" cy="60" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Surface shine -->
    <linearGradient id="shineGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient glow in center -->
  <circle cx="60" cy="60" r="35" fill="url(#coreGlow)"/>

  <!-- Geometric Futuristic "X" Nexus -->
  <g filter="url(#bloom)">
    <!-- Primary dynamic ribbon: Upper Left to Lower Right -->
    <path d="M28 26 C28 24 32 22 36 24 L52 38 L68 52 L92 76 C96 80 94 86 88 88 L76 92 C72 93 68 91 64 87 L48 71 L32 55 L26 40 C24 34 26 28 28 26 Z" 
          fill="url(#wing1Grad)"/>

    <!-- Counter dynamic ribbon: Upper Right to Lower Left -->
    <path d="M92 26 C94 28 96 34 94 40 L88 55 L72 71 L56 87 C52 91 48 93 44 92 L32 88 C26 86 24 80 28 76 L52 52 L68 38 L84 24 C88 22 92 24 92 26 Z" 
          fill="url(#wing2Grad)"/>

    <!-- Intersecting Crystal Prism Facets -->
    <!-- Top Apex Wedge -->
    <polygon points="60,34 50,44 60,54 70,44" fill="#FFFFFF" fill-opacity="0.25"/>
    
    <!-- Central Core Nexus Diamond -->
    <polygon points="60,48 48,60 60,72 72,60" fill="#FFFFFF" fill-opacity="0.95"/>
    <polygon points="60,52 52,60 60,68 68,60" fill="#06B6D4"/>
    
    <!-- Highlights and specular facets -->
    <path d="M36 24 L52 38 L48 42 L32 28 Z" fill="url(#shineGrad)"/>
    <path d="M84 24 L68 38 L72 42 L88 28 Z" fill="url(#shineGrad)"/>
  </g>
</svg>
